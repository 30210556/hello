<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>푸리에 주파수 분해 기계 (2Hz + 3Hz)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; }
        .control-group { display: flex; flex-direction: column; flex: 1; }
        .control-group label { font-weight: bold; margin-bottom: 5px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .full-width { grid-column: span 2; }
        canvas { width: 100% !important; height: 320px !important; }
        button { padding: 12px 24px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Synthesizer & Fourier Analyzer (주파수 분해 기계)</h2>
    <p>2Hz와 3Hz의 순수 주파수가 섞인 합성 신호를 분석합니다. 감기 진동수가 2.0Hz나 3.0Hz에 도달하면 복소평면의 무게중심이 쏠리며, 하단의 분해 그래프에 피크가 솟아오릅니다.</p>
    
    <div class="controls">
        <div class="control-group">
            <label for="freqInput">현재 감기 진동수 (Winding Freq): <span id="freqVal">1.0</span> Hz</label>
            <input type="range" id="freqInput" min="0.5" max="4.5" step="0.05" value="1.0">
        </div>
        <div>
            <button id="startBtn">분석 애니메이션 가동</button>
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container">
            <h3>1. 합성 신호 시간 그래프 $f(t) = \sin(2\pi \cdot 2t) + \sin(2\pi \cdot 3t)$</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 복소평면 감기 시각화 (시계방향)</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container full-width">
            <h3>3. 주파수 분해 기계 스펙트럼 (X: 진동수, Y: 무게중심 변위량)</h3>
            <canvas id="fourierChart"></canvas>
        </div>
    </div>
</div>

<script>
    // 상수 설정
    const maxTime = 3.0; // 분석할 총 시간 세기 (3초)
    const dt = 0.015;    // 타임스텝
    
    // 상태 변수
    let windingFreq = 1.0;
    let currentTime = 0;
    let animationFrameId = null;
    
    // 데이터 셋
    let complexPoints = [];
    let sumReal = 0, sumImag = 0, count = 0;
    
    // 주파수 분해 그래프용 마스터 데이터 (0.5Hz부터 4.5Hz까지 0.05단위 미리 계산 틀 확보)
    const freqBins = [];
    for(let f=0.5; f<=4.5; f+=0.05) freqBins.push(parseFloat(f.toFixed(2)));
    let fourierMagnitudes = new Array(freqBins.length).fill(0);

    let timeChart, complexChart, fourierChart;

    // DOM
    const freqInput = document.getElementById('freqInput');
    const freqVal = document.getElementById('freqVal');
    const startBtn = document.getElementById('startBtn');

    freqInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        freqVal.innerText = windingFreq.toFixed(2);
        resetSimulation();
    });
    startBtn.addEventListener('click', startSimulation);

    // 신호 함수: 2Hz 사인파 + 3Hz 사인파 합성
    function signalFunction(t) {
        return Math.sin(2 * Math.PI * 2 * t) + Math.sin(2 * Math.PI * 3 * t);
    }

    function initCharts() {
        // 1. 시간 차트
        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '합성 신호 f(t)', data: [], borderColor: '#4bbfbf', pointRadius: 0 },
                    { label: '현재 분석 위치', data: [], borderColor: 'red', borderDash: [5,5], pointRadius: 0 }
                ]
            },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime }, y: { min: -2.5, max: 2.5 } }, animation: false }
        });

        // 2. 복소평면 차트
        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '감긴 궤적', data: [], borderColor: 'rgba(54, 162, 235, 0.4)', showLine: true, pointRadius: 0 },
                    { label: '현재 끝점', data: [], backgroundColor: 'red', pointRadius: 5 },
                    { label: '실시간 무게중심', data: [], backgroundColor: 'green', pointRadius: 8, pointStyle: 'triangle' }
                ]
            },
            options: { scales: { x: { min: -2.5, max: 2.5 }, y: { min: -2.5, max: 2.5 } }, aspectRatio: 1, animation: false }
        });

        // 3. 푸리에 주파수 분해 차트 (특정 주파수에서 튀는 그래프)
        fourierChart = new Chart(document.getElementById('fourierChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: freqBins,
                datasets: [{
                    label: '무게중심 변위 (신호 세기)',
                    data: fourierMagnitudes,
                    borderColor: '#963dd4',
                    backgroundColor: 'rgba(150, 61, 212, 0.1)',
                    fill: true,
                    tension: 0.2
                }]
            },
            options: { 
                scales: { 
                    x: { title: { display: true, text: '진동수 (Frequency [Hz])' } }, 
                    y: { min: 0, max: 1.2, title: { display: true, text: '원점으로부터의 거리 (Magnitude)' } } 
                },
                animation: false 
            }
        });
    }

    function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        currentTime = 0;
        complexPoints = [];
        sumReal = 0; sumImag = 0; count = 0;

        // 시간 축 데이터 정적 가이드라인 생성
        let t_arr = [];
        for(let t=0; t<=maxTime; t+=dt) t_arr.push({x: t, y: signalFunction(t)});
        
        timeChart.data.datasets[0].data = t_arr;
        timeChart.data.datasets[1].data = [];
        
        complexChart.data.datasets[0].data = [];
        complexChart.data.datasets[1].data = [];
        complexChart.data.datasets[2].data = [];

        // 현재 설정된 windingFreq 위치에 맞추어 하단 스펙트럼 데이터 초기화 (현재 조사중인 곳만 실시간 반영 유도)
        fourierChart.data.datasets[0].data = freqBins.map(f => f === windingFreq ? 0 : calculateStaticFT(f));

        timeChart.update();
        complexChart.update();
        fourierChart.update();
    }

    // 다른 주파수들의 배경 값을 미리 계산해주는 헬퍼 함수
    function calculateStaticFT(targetFreq) {
        let sReal = 0, sImag = 0, c = 0;
        for(let t=0; t<=maxTime; t+=dt) {
            let f_t = signalFunction(t);
            let theta = -2 * Math.PI * targetFreq * t;
            sReal += f_t * Math.cos(theta);
            sImag += f_t * Math.sin(theta);
            c++;
        }
        return Math.sqrt((sReal/c)**2 + (sImag/c)**2);
    }

    function startSimulation() {
        resetSimulation();
        animate();
    }

    function animate() {
        if (currentTime > maxTime) {
            cancelAnimationFrame(animationFrameId);
            return;
        }

        let f_t = signalFunction(currentTime);
        let theta = -2 * Math.PI * windingFreq * currentTime;
        let real = f_t * Math.cos(theta);
        let imag = f_t * Math.sin(theta);

        sumReal += real;
        sumImag += imag;
        count++;
        
        let centerReal = sumReal / count;
        let centerImag = sumImag / count;
        let magnitude = Math.sqrt(centerReal**2 + centerImag**2); // 원점으로부터 무게중심까지의 거리

        // 데이터 대입
        complexPoints.push({x: real, y: imag});
        timeChart.data.datasets[1].data = [{x: currentTime, y: -2.5}, {x: currentTime, y: 2.5}];
        
        complexChart.data.datasets[0].data = [...complexPoints];
        complexChart.data.datasets[1].data = [{x: real, y: imag}];
        complexChart.data.datasets[2].data = [{x: centerReal, y: centerImag}];

        // 하단 주파수 분해 그래프에서 현재 조사중인 주파수의 바(실시간 갱신)
        let idx = freqBins.indexOf(windingFreq);
        if(idx !== -1) {
            fourierChart.data.datasets[0].data[idx] = magnitude;
        }

        timeChart.update();
        complexChart.update();
        fourierChart.update();

        currentTime += dt;
        animationFrameId = requestAnimationFrame(animate);
    }

    window.onload = () => {
        initCharts();
        resetSimulation();
    };
</script>

</body>
</html>
