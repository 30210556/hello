<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주파수 분해 기계: 원형 감기 시각화</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0b0f19; 
            color: #e2e8f0; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #61dafb; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; }
        
        /* 컨트롤러 디자인 */
        .controls { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            margin-bottom: 25px; 
        }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 220px; flex: 1; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        input[type="number"] { 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
        }
        input[type="range"] { 
            width: 100%; 
            accent-color: #61dafb;
        }
        
        /* 그래프 레이아웃 */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
        }
        .chart-container h3 { margin-top: 0; font-size: 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        canvas { width: 100% !important; height: 320px !important; }
        
        button { 
            padding: 12px 30px; 
            background: linear-gradient(135deg, #38bdf8, #0369a1); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(3, 105, 161, 0.4);
        }
        .highlight-freq { color: #f43f5e; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fourier Winding Machine (원형 파형 감기 기계)</h2>
    <p>선형의 시간 그래프를 둥근 원형 틀에 감아 보며, 파형의 무게중심이 쏠리는 기하학적 흔적을 추적합니다.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">합성 주파수 A (Hz)</label>
                <input type="number" id="freq1" value="2" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group">
                <label for="freq2">합성 주파수 B (Hz)</label>
                <input type="number" id="freq2" value="3" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="startBtn">실시간 감기 시작</button>
            </div>
        </div>
        <div class="control-group">
            <label for="windingFreqInput">기계가 파형을 감는 진동수: <span id="windingFreqVal" class="highlight-freq">1.00</span> Hz</label>
            <input type="range" id="windingFreqInput" min="0.5" max="5.0" step="0.05" value="1.0">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container">
            <h3>1. 원래 시간-세기 그래프 (선형 파형)</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 원형 틀에 둘둘 감아버린 파형 (기하학적 매핑)</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container full-width">
            <h3>3. 흐른 시간에 따른 무게중심의 중심 이탈도 (일치할 때 위로 급등)</h3>
            <canvas id="centerTrackingChart"></canvas>
        </div>
    </div>
</div>

<script>
    const maxTime = 4.0; 
    const dt = 0.015;     
    
    let currentTime = 0;
    let animationFrameId = null;
    
    let f1 = 2.0;
    let f2 = 3.0;
    let windingFreq = 1.0;
    
    let complexPoints = [];
    let trackingMagnitudeY = [];
    let sumReal = 0, sumImag = 0, count = 0;

    let timeChart, complexChart, centerTrackingChart;

    const freq1Input = document.getElementById('freq1');
    const freq2Input = document.getElementById('freq2');
    const windingInput = document.getElementById('windingFreqInput');
    const windingVal = document.getElementById('windingFreqVal');
    const startBtn = document.getElementById('startBtn');

    windingInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        windingVal.innerText = windingFreq.toFixed(2);
        resetSimulation();
    });
    
    freq1Input.addEventListener('change', () => { f1 = parseFloat(freq1Input.value); resetSimulation(); });
    freq2Input.addEventListener('change', () => { f2 = parseFloat(freq2Input.value); resetSimulation(); });
    startBtn.addEventListener('click', startSimulation);

    // 합성 함수 (2개 진동수 조합)
    function signalFunction(t) {
        // 기본 반지름 역할을 할 수 있도록 오프셋(+2.0)을 주어 원형 결이 예쁘게 보이도록 유도
        return 2.0 + Math.sin(2 * Math.PI * f1 * t) + Math.sin(2 * Math.PI * f2 * t);
    }

    function initCharts() {
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        // 1. 시간 그래프 (부드러운 곡선 처리)
        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '합성 신호 f(t)', data: [], borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0, tension: 0.4 },
                    { label: '현재 감는 위치', data: [], borderColor: '#f43f5e', borderDash: [4,4], pointRadius: 0 }
                ]
            },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime } }, animation: false, plugins: { legend: { display: false } } }
        });

        // 2. 원형 감기 그래프 (네온 그린 톤)
        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '원형으로 감긴 파형', data: [], borderColor: '#4ade80', borderWidth: 2, showLine: true, pointRadius: 0, tension: 0.4 },
                    { label: '현재 끝점', data: [], backgroundColor: '#f43f5e', pointRadius: 6 },
                    { label: '무게중심', data: [], backgroundColor: '#fbbf24', pointRadius: 9, pointStyle: 'rectRot' }
                ]
            },
            options: { 
                scales: { 
                    x: { min: -4.5, max: 4.5, grid: { color: '#1e293b' } }, 
                    y: { min: -4.5, max: 4.5, grid: { color: '#1e293b' } } 
                }, 
                aspectRatio: 1, 
                animation: false,
                plugins: { legend: { labels: { boxWidth: 12 } } }
            }
        });

        // 3. 무게중심 실시간 급등 그래프
        centerTrackingChart = new Chart(document.getElementById('centerTrackingChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: '중심 탈출 거리',
                    data: [],
                    borderColor: '#a855f7',
                    backgroundColor: 'rgba(168, 85, 247, 0.1)',
                    fill: true,
                    pointRadius: 0,
                    tension: 0.2
                }]
            },
            options: {
                scales: {
                    x: { type: 'linear', min: 0, max: maxTime, title: { display: true, text: '시간 (초)' } },
                    y: { min: 0, max: 2.5, title: { display: true, text: '이탈 거리' } }
                },
                animation: false
            }
        });
    }

    function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        currentTime = 0;
        complexPoints = [];
        trackingMagnitudeY = [];
        sumReal = 0; sumImag = 0; count = 0;

        let t_arr = [];
        for(let t=0; t<=maxTime; t+=dt) t_arr.push({x: t, y: signalFunction(t) - 2.0}); // 시각화 가이드는 기본 파형만
        
        timeChart.data.datasets[0].data = t_arr;
        timeChart.data.datasets[1].data = [];
        
        complexChart.data.datasets[0].data = [];
        complexChart.data.datasets[1].data = [];
        complexChart.data.datasets[2].data = [];
        centerTrackingChart.data.datasets[0].data = [];
        
        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();
    }

    function startSimulation() {
        f1 = parseFloat(freq1Input.value);
        f2 = parseFloat(freq2Input.value);
        windingFreq = parseFloat(windingInput.value);
        resetSimulation();
        animate();
    }

    function animate() {
        if (currentTime > maxTime) {
            cancelAnimationFrame(animationFrameId);
            return;
        }

        // 원형 감기가 찌그러지지 않고 예쁜 트랙 모양을 그리도록 감기 알고리즘 수정
        let radius = signalFunction(currentTime); 
        let theta = -2 * Math.PI * windingFreq * currentTime; // 시계방향 회전각
        
        let x = radius * Math.cos(theta);
        let y = radius * Math.sin(theta);

        // 무게중심 추적 (순수 신호 성분의 편향도 측정)
        let pure_f_t = radius - 2.0; 
        sumReal += pure_f_t * Math.cos(theta);
        sumImag += pure_f_t * Math.sin(theta);
        count++;
        
        let centerReal = sumReal / count;
        let centerImag = sumImag / count;
        let distanceFromCenter = Math.sqrt(centerReal**2 + centerImag**2);

        complexPoints.push({x: x, y: y});
        trackingMagnitudeY.push({x: currentTime, y: distanceFromCenter});

        // 1번 차트 탐침선
        timeChart.data.datasets[1].data = [{x: currentTime, y: -2.5}, {x: currentTime, y: 2.5}];
        
        // 2번 차트 (원형 감기 선 및 무게중심)
        complexChart.data.datasets[0].data = [...complexPoints];
        complexChart.data.datasets[1].data = [{x: x, y: y}];
        // 무게중심 위치 시각적 매핑을 위해 배율 조정
        complexChart.data.datasets[2].data = [{x: centerReal * 2, y: centerImag * 2}]; 

        // 3번 차트 (시간 대비 급등선)
        centerTrackingChart.data.datasets[0].data = [...trackingMagnitudeY];

        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();

        currentTime += dt;
        animationFrameId = requestAnimationFrame(animate);
    }

    window.onload = () => {
        initCharts();
        resetSimulation();
    };
</script>

</body>
</html>
