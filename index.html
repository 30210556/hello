<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>푸리에 주파수 분석기 - 수동 정밀 조절 버전</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0b0f19; 
            color: #e2e8f0; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #61dafb; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; }
        
        .controls { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            margin-bottom: 25px; 
        }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 220px; flex: 1; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        input[type="number"] { 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
        }
        input[type="range"] { 
            width: 100%; 
            accent-color: #61dafb;
        }
        
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
        }
        .chart-container h3 { margin-top: 0; font-size: 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        canvas { width: 100% !important; height: 300px !important; }
        
        button { 
            padding: 12px 30px; 
            background: linear-gradient(135deg, #38bdf8, #0369a1); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(3, 105, 161, 0.4);
        }
        .highlight-freq { color: #f43f5e; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fourier Winding Machine (수동 정밀 분석기)</h2>
    <p>슬라이더를 조절해 감기 진동수를 변경하면 2번 그래프의 회전과 3번 그래프의 붉은 플롯선 위치가 실시간으로 연동됩니다.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">합성 주파수 A (Hz)</label>
                <input type="number" id="freq1" value="2" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group">
                <label for="freq2">합성 주파수 B (Hz)</label>
                <input type="number" id="freq2" value="3" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="startBtn">실시간 감기 애니메이션 재생</button>
            </div>
        </div>
        <div class="control-group">
            <label for="windingFreqInput">기계가 파형을 감는 진동수: <span id="windingFreqVal" class="highlight-freq">1.00</span> 바퀴/초</label>
            <input type="range" id="windingFreqInput" min="0.0" max="5.0" step="0.02" value="1.0">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container full-width">
            <h3>1. 원래 시간-세기 그래프 $f(t)$ (관찰 시간: 10초)</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 원형 틀에 둘둘 감아버린 파형 (회전 속도 최적화)</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>3. $x$좌표의 무게 중심 스펙트럼 (X: 진동수, Y: 무게중심 $x$값)</h3>
            <canvas id="fourierChart"></canvas>
        </div>
    </div>
</div>

<script>
    const maxTime = 10.0; 
    //dt 간격을 조절하여 복소평면의 회전 속도를 눈이 편안하도록 훨씬 느리고 부드럽게 낮췄습니다.
    const dt = 0.04;     
    
    let currentTime = 0;
    let animationFrameId = null;
    
    let f1 = 2.0;
    let f2 = 3.0;
    let windingFreq = 1.0;
    
    let complexPoints = [];
    let sumX = 0, sampleCount = 0;

    let timeChart, complexChart, fourierChart;

    const freq1Input = document.getElementById('freq1');
    const freq2Input = document.getElementById('freq2');
    const windingInput = document.getElementById('windingFreqInput');
    const windingVal = document.getElementById('windingFreqVal');
    const startBtn = document.getElementById('startBtn');

    // 슬라이더를 움직이면 실시간으로 진동수가 바뀌며 그래프들이 즉시 동적 연동됩니다.
    windingInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        windingVal.innerText = windingFreq.toFixed(2);
        calculateFullFourierSpectrum(); // 3번 전체 배경 곡선 미리 계산
        resetSimulation();
    });
    
    freq1Input.addEventListener('change', () => { f1 = parseFloat(freq1Input.value); calculateFullFourierSpectrum(); resetSimulation(); });
    freq2Input.addEventListener('change', () => { f2 = parseFloat(freq2Input.value); calculateFullFourierSpectrum(); resetSimulation(); });
    startBtn.addEventListener('click', startSimulation);

    function signalFunction(t) {
        return Math.sin(2 * Math.PI * f1 * t) + Math.sin(2 * Math.PI * f2 * t);
    }

    function initCharts() {
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: { datasets: [{ data: [], borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0, tension: 0.3 }] },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime } }, animation: false, plugins: { legend: { display: false } } }
        });

        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '감긴 파형', data: [], borderColor: '#4ade80', borderWidth: 1.5, showLine: true, pointRadius: 0, tension: 0.3 },
                    { label: '현재 끝점', data: [], backgroundColor: '#f43f5e', pointRadius: 6 },
                    { label: '현재 무게중심', data: [], backgroundColor: '#fbbf24', pointRadius: 8 }
                ]
            },
            options: { 
                scales: { x: { min: -2.5, max: 2.5 }, y: { min: -2.5, max: 2.5 } }, 
                aspectRatio: 1, animation: false, plugins: { legend: { display: false } }
            }
        });

        fourierChart = new Chart(document.getElementById('fourierChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '전체 스펙트럼 라인', data: [], borderColor: '#475569', borderWidth: 1, borderDash: [2, 2], pointRadius: 0, fill: false },
                    { label: '현재 주파수까지의 흔적', data: [], borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', borderWidth: 2, fill: true, pointRadius: 0, tension: 0.2 },
                    { label: '현재 탐침 탐색기', data: [], backgroundColor: '#ffffff', pointRadius: 6 }
                ]
            },
            options: {
                scales: {
                    x: { type: 'linear', min: 0, max: 5.0, title: { display: true, text: '진동수 (Hz)' } },
                    y: { min: -0.1, max: 1.0, title: { display: true, text: '무게중심 X' } }
                },
                animation: false,
                plugins: { legend: { display: false } }
            }
        });
    }

    // 배경에 깔릴 푸리에 변환 맵을 미리 연산해두는 헬퍼 함수
    function calculateFullFourierSpectrum() {
        let fullSpectrum = [];
        let tracedSpectrum = [];
        
        // 0Hz부터 5Hz까지 루프를 돌며 무게중심 x좌표 추출
        for (let f = 0; f <= 5.0; f += 0.02) {
            let sX = 0, c = 0;
            for (let t = 0; t <= maxTime; t += 0.02) {
                let theta = -2 * Math.PI * f * t;
                sX += signalFunction(t) * Math.cos(theta);
                c++;
            }
            let avgX = Math.abs(sX / c);
            fullSpectrum.push({x: f, y: avgX});
            
            // 현재 슬라이더가 위치한 주파수 이하의 값만 붉은 채우기 영역으로 분류
            if (f <= windingFreq) {
                tracedSpectrum.push({x: f, y: avgX});
            }
        }
        
        fourierChart.data.datasets[0].data = fullSpectrum;
        fourierChart.data.datasets[1].data = tracedSpectrum;
        
        // 하얀색 탐침 점의 현재 Y 위치 지정
        let currentWindingY = 0;
        let closest = fullSpectrum.reduce((prev, curr) => Math.abs(curr.x - windingFreq) < Math.abs(prev.x - windingFreq) ? curr : prev);
        currentWindingY = closest.y;
        fourierChart.data.datasets[2].data = [{x: windingFreq, y: currentWindingY}];
        
        fourierChart.update();
    }

    function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        currentTime = 0;
        complexPoints = [];
        sumX = 0; 
        sampleCount = 0;

        let t_arr = [];
        for(let t=0; t<=maxTime; t+=0.02) {
            t_arr.push({x: t, y: signalFunction(t)});
        }
        timeChart.data.datasets[0].data = t_arr;
        
        complexChart.data.datasets[0].data = [];
        complexChart.data.datasets[1].data = [];
        complexChart.data.datasets[2].data = [];
        
        timeChart.update();
        complexChart.update();
    }

    function startSimulation() {
        resetSimulation();
        animate();
    }

    function animate() {
        if (currentTime > maxTime) {
            cancelAnimationFrame(animationFrameId);
            return;
        }

        let f_t = signalFunction(currentTime); 
        let theta = -2 * Math.PI * windingFreq * currentTime; 
        
        let x = f_t * Math.cos(theta);
        let y = f_t * Math.sin(theta);

        sumX += x;
        sampleCount++;
        let centerOfGravityX = sumX / sampleCount;

        complexPoints.push({x: x, y: y});

        // 2번 복소평면 업데이트 (속도가 늦춰져서 선이 그려지는 궤적이 눈에 명확히 보입니다)
        complexChart.data.datasets[0].data = [...complexPoints];
        complexChart.data.datasets[1].data = [{x: x, y: y}];
        complexChart.data.datasets[2].data = [{x: centerOfGravityX, y: 0}]; // 노란색 무게중심 점 추가

        complexChart.update();

        currentTime += dt;
        // 부드럽게 감기는 모습을 제어하기 위해 프레임 타이밍 조절
        animationFrameId = requestAnimationFrame(animate);
    }

    window.onload = () => {
        initCharts();
        calculateFullFourierSpectrum();
        resetSimulation();
    };
</script>

</body>
</html>
