<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>푸리에 주파수 분석기 - 수동 슬라이더 전용</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0b0f19; 
            color: #e2e8f0; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #61dafb; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; }
        
        .controls { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            margin-bottom: 25px; 
        }
        .input-row { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 220px; flex: 1; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        input[type="number"] { 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
        }
        
        /* 슬라이더 영역 시각적 강조 */
        .slider-container {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            margin-top: 10px;
        }
        input[type="range"] { 
            width: 100%; 
            margin-top: 15px;
            display: block;
            cursor: pointer;
            accent-color: #61dafb;
        }
        
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
        }
        .chart-container h3 { margin-top: 0; font-size: 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        canvas { width: 100% !important; height: 300px !important; }
        .highlight-freq { color: #f43f5e; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fourier Winding Machine (수동 정밀 조절기)</h2>
    <p>주파수를 고정하여 자동 스캔하는 버튼을 없앴습니다. 오직 아래 파란색 박스의 슬라이더 조절로만 움직입니다.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">합성 주파수 A (Hz)</label>
                <input type="number" id="freq1" value="2" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group">
                <label for="freq2">합성 주파수 B (Hz)</label>
                <input type="number" id="freq2" value="3" min="0.5" max="8" step="0.5">
            </div>
        </div>
        
        <div class="slider-container">
            <label for="windingFreqInput" style="display: flex; justify-content: space-between; font-weight: bold;">
                <span style="color: #38bdf8; font-size: 16px;">🎛️ 슬라이더를 마우스로 드래그하여 감기 진동수를 바꾸세요:</span>
                <span><span id="windingFreqVal" class="highlight-freq">1.00</span> 바퀴/초 (Hz)</span>
            </label>
            <input type="range" id="windingFreqInput" min="0.0" max="5.0" step="0.02" value="1.00">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container full-width">
            <h3>1. 원래 시간-세기 그래프 $f(t)$ (관찰 시간: 10초)</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 현재 진동수로 둘둘 감아버린 파형 (수동 연동)</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>3. $x$좌표의 무게 중심 스펙트럼 (하얀 점 = 현재 슬라이더 위치)</h3>
            <canvas id="fourierChart"></canvas>
        </div>
    </div>
</div>

<script>
    const maxTime = 10.0; 
    const dt = 0.02;     
    
    let f1 = 2.0;
    let f2 = 3.0;
    let windingFreq = 1.0;

    let timeChart, complexChart, fourierChart;

    const freq1Input = document.getElementById('freq1');
    const freq2Input = document.getElementById('freq2');
    const windingInput = document.getElementById('windingFreqInput');
    const windingVal = document.getElementById('windingFreqVal');

    // 슬라이더를 움직이는 순간 즉각 반응하는 이벤트
    windingInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        windingVal.innerText = windingFreq.toFixed(2);
        updateAllVisuals();
    });
    
    freq1Input.addEventListener('change', () => { f1 = parseFloat(freq1Input.value); updateAllVisuals(); });
    freq2Input.addEventListener('change', () => { f2 = parseFloat(freq2Input.value); updateAllVisuals(); });

    function signalFunction(t) {
        return Math.sin(2 * Math.PI * f1 * t) + Math.sin(2 * Math.PI * f2 * t);
    }

    function initCharts() {
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: { datasets: [{ data: [], borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0, tension: 0.3 }] },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime } }, animation: false, plugins: { legend: { display: false } } }
        });

        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '감긴 파형', data: [], borderColor: '#4ade80', borderWidth: 1.5, showLine: true, pointRadius: 0, tension: 0.2 },
                    { label: '현재 무게중심', data: [], backgroundColor: '#fbbf24', pointRadius: 9 }
                ]
            },
            options: { 
                scales: { x: { min: -2.5, max: 2.5 }, y: { min: -2.5, max: 2.5 } }, 
                aspectRatio: 1, animation: false, plugins: { legend: { display: false } }
            }
        });

        fourierChart = new Chart(document.getElementById('fourierChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '전체 스펙트럼 라인', data: [], borderColor: '#475569', borderWidth: 1, borderDash: [2, 2], pointRadius: 0, fill: false },
                    { label: '현재 주파수까지의 흔적', data: [], borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', borderWidth: 2, fill: true, pointRadius: 0, tension: 0.2 },
                    { label: '현재 탐침 위치', data: [], backgroundColor: '#ffffff', pointRadius: 7 }
                ]
            },
            options: {
                scales: {
                    x: { type: 'linear', min: 0, max: 5.0, title: { display: true, text: '진동수 (Hz)' } },
                    y: { min: -0.1, max: 1.0, title: { display: true, text: '무게중심 X' } }
                },
                animation: false,
                plugins: { legend: { display: false } }
            }
        });
    }

    // 슬라이더 조절 시 복소평면 감기와 하단 스펙트럼을 동시 업데이트하는 핵심 연산 함수
    function updateAllVisuals() {
        // 1. 시간 그래프 갱신
        let t_arr = [];
        for(let t=0; t<=maxTime; t+=0.04) {
            t_arr.push({x: t, y: signalFunction(t)});
        }
        timeChart.data.datasets[0].data = t_arr;
        timeChart.update();

        // 2. 현재 슬라이더 진동수 기준으로 10초 분량 원형 감기 및 무게중심 계산
        let complexPoints = [];
        let sumX = 0, cCount = 0;
        for (let t = 0; t <= maxTime; t += dt) {
            let f_t = signalFunction(t);
            let theta = -2 * Math.PI * windingFreq * t;
            let x = f_t * Math.cos(theta);
            let y = f_t * Math.sin(theta);
            
            complexPoints.push({x: x, y: y});
            sumX += x;
            cCount++;
        }
        let centerOfGravityX = sumX / cCount;
        complexChart.data.datasets[0].data = complexPoints;
        complexChart.data.datasets[1].data = [{x: centerOfGravityX, y: 0}];
        complexChart.update();

        // 3. 3번 스펙트럼 라인 계산 및 실시간 탐침 동기화
        let fullSpectrum = [];
        let tracedSpectrum = [];
        for (let f = 0; f <= 5.0; f += 0.04) {
            let sX = 0, c = 0;
            for (let t = 0; t <= maxTime; t += 0.04) {
                let theta = -2 * Math.PI * f * t;
                sX += signalFunction(t) * Math.cos(theta);
                c++;
            }
            let avgX = Math.abs(sX / c);
            fullSpectrum.push({x: f, y: avgX});
            
            if (f <= windingFreq) {
                tracedSpectrum.push({x: f, y: avgX});
            }
        }
        
        fourierChart.data.datasets[0].data = fullSpectrum;
        fourierChart.data.datasets[1].data = tracedSpectrum;
        
        let currentWindingY = 0;
        if(fullSpectrum.length > 0) {
            let closest = fullSpectrum.reduce((prev, curr) => Math.abs(curr.x - windingFreq) < Math.abs(prev.x - windingFreq) ? curr : prev);
            currentWindingY = closest.y;
        }
        fourierChart.data.datasets[2].data = [{x: windingFreq, y: currentWindingY}];
        fourierChart.update();
    }

    window.onload = () => {
        initCharts();
        updateAllVisuals();
    };
</script>

</body>
</html>
