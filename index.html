<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>커스텀 푸리에 주파수 분석기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 200px; flex: 1; }
        .control-group label { font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="number"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input[type="range"] { width: 100%; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .full-width { grid-column: span 2; }
        canvas { width: 100% !important; height: 300px !important; }
        button { padding: 10px 25px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>기하학적 푸리에 분석기 (사용자 정의 신호)</h2>
    <p>원하는 순수 진동수 2개를 입력하여 복잡한 신호를 합성하고, 아래 슬라이더로 '감기 진동수'를 조절해 보세요.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">첫 번째 신호 진동수 (Hz)</label>
                <input type="number" id="freq1" value="2" min="0.1" max="10" step="0.1">
            </div>
            <div class="control-group">
                <label for="freq2">두 번째 신호 진동수 (Hz)</label>
                <input type="number" id="freq2" value="3" min="0.1" max="10" step="0.1">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="startBtn">분석 애니메이션 가동</button>
            </div>
        </div>
        <hr style="border: 0; height: 1px; background: #eee; margin: 15px 0;">
        <div class="control-group">
            <label for="windingFreqInput">현재 기계가 감는 진동수: <span id="windingFreqVal" style="color:#dc3545; font-size:18px;">1.00</span> Hz</label>
            <input type="range" id="windingFreqInput" min="0.5" max="5.0" step="0.05" value="1.0">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container">
            <h3>1. 합성 신호 시간 그래프 $f(t)$</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 복소평면 시계방향 감기</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container full-width">
            <h3>3. 시간에 따른 무게중심의 중심 이탈도 (X: 시간, Y: 무게중심 좌표 거리)</h3>
            <canvas id="centerTrackingChart"></canvas>
        </div>
    </div>
</div>

<script>
    const maxTime = 4.0; // 총 관찰 시간 (4초)
    const dt = 0.02;     // 시간 간격
    
    let currentTime = 0;
    let animationFrameId = null;
    
    // 사용자 입력 변수들
    let f1 = 2.0;
    let f2 = 3.0;
    let windingFreq = 1.0;
    
    // 데이터 저장소
    let complexPoints = [];
    let trackingTimeX = [];
    let trackingMagnitudeY = [];
    let sumReal = 0, sumImag = 0, count = 0;

    let timeChart, complexChart, centerTrackingChart;

    // DOM 요소 연결
    const freq1Input = document.getElementById('freq1');
    const freq2Input = document.getElementById('freq2');
    const windingInput = document.getElementById('windingFreqInput');
    const windingVal = document.getElementById('windingFreqVal');
    const startBtn = document.getElementById('startBtn');

    // 이벤트 리스너
    windingInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        windingVal.innerText = windingFreq.toFixed(2);
        resetSimulation();
    });
    
    // 진동수 숫자가 바뀌면 즉시 리셋
    freq1Input.addEventListener('change', () => { f1 = parseFloat(freq1Input.value); resetSimulation(); });
    freq2Input.addEventListener('change', () => { f2 = parseFloat(freq2Input.value); resetSimulation(); });
    startBtn.addEventListener('click', startSimulation);

    // 사용자가 입력한 두 진동수를 더하는 합성 함수
    function signalFunction(t) {
        return Math.sin(2 * Math.PI * f1 * t) + Math.sin(2 * Math.PI * f2 * t);
    }

    function initCharts() {
        // 차트 1: 합성 신호
        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '합성 신호 f(t)', data: [], borderColor: '#4bbfbf', pointRadius: 0 },
                    { label: '현재 분석 위치', data: [], borderColor: 'red', borderDash: [5,5], pointRadius: 0 }
                ]
            },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime, title: {display:true, text:'시간 (초)'} }, y: { min: -2.5, max: 2.5 } }, animation: false }
        });

        // 차트 2: 복소평면
        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '감긴 궤적', data: [], borderColor: 'rgba(54, 162, 235, 0.4)', showLine: true, pointRadius: 0 },
                    { label: '현재 끝점', data: [], backgroundColor: 'red', pointRadius: 5 },
                    { label: '실시간 무게중심', data: [], backgroundColor: 'green', pointRadius: 8, pointStyle: 'triangle' }
                ]
            },
            options: { 
                scales: { 
                    x: { min: -2.5, max: 2.5, title: {display:true, text:'실수축'} }, 
                    y: { min: -2.5, max: 2.5, title: {display:true, text:'허수축'} } 
                }, 
                aspectRatio: 1, 
                animation: false 
            }
        });

        // 차트 3: 요청하신 X축이 '시간'이고 Y축이 '무게중심 이탈도'인 그래프
        centerTrackingChart = new Chart(document.getElementById('centerTrackingChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '원점으로부터 무게중심의 거리 (이탈도)',
                    data: [],
                    borderColor: '#dc3545',
                    backgroundColor: 'rgba(220, 53, 69, 0.1)',
                    fill: true,
                    pointRadius: 0
                }]
            },
            options: {
                scales: {
                    x: { type: 'linear', min: 0, max: maxTime, title: { display: true, text: '흐른 시간 (초)' } },
                    y: { min: 0, max: 1.2, title: { display: true, text: '중심에서 벗어난 거리' } }
                },
                animation: false
            }
        });
    }

    function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        currentTime = 0;
        complexPoints = [];
        trackingTimeX = [];
        trackingMagnitudeY = [];
        sumReal = 0; sumImag = 0; count = 0;

        // 배경 시간 가이드라인 생성
        let t_arr = [];
        for(let t=0; t<=maxTime; t+=dt) t_arr.push({x: t, y: signalFunction(t)});
        
        timeChart.data.datasets[0].data = t_arr;
        timeChart.data.datasets[1].data = [];
        
        complexChart.data.datasets[0].data = [];
        complexChart.data.datasets[1].data = [];
        complexChart.data.datasets[2].data = [];

        centerTrackingChart.data.datasets[0].data = [];
        
        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();
    }

    function startSimulation() {
        f1 = parseFloat(freq1Input.value);
        f2 = parseFloat(freq2Input.value);
        windingFreq = parseFloat(windingInput.value);
        resetSimulation();
        animate();
    }

    function animate() {
        if (currentTime > maxTime) {
            cancelAnimationFrame(animationFrameId);
            return;
        }

        let f_t = signalFunction(currentTime);
        let theta = -2 * Math.PI * windingFreq * currentTime;
        let real = f_t * Math.cos(theta);
        let imag = f_t * Math.sin(theta);

        sumReal += real;
        sumImag += imag;
        count++;
        
        let centerReal = sumReal / count;
        let centerImag = sumImag / count;
        // 피타고라스 정리로 원점(0,0)에서 현재 무게중심까지의 직선 거리 계산
        let distanceFromCenter = Math.sqrt(centerReal**2 + centerImag**2); 

        // 데이터 배열 추가
        complexPoints.push({x: real, y: imag});
        trackingTimeX.push(currentTime);
        trackingMagnitudeY.push({x: currentTime, y: distanceFromCenter});

        // 1번 차트 갱신 (빨간 탐침선 이동)
        timeChart.data.datasets[1].data = [{x: currentTime, y: -2.5}, {x: currentTime, y: 2.5}];
        
        // 2번 차트 갱신 (복소평면 그리기)
        complexChart.data.datasets[0].data = [...complexPoints];
        complexChart.data.datasets[1].data = [{x: real, y: imag}];
        complexChart.data.datasets[2].data = [{x: centerReal, y: centerImag}];

        // 3번 차트 갱신 (X: 시간, Y: 무게중심 거리)
        centerTrackingChart.data.datasets[0].data = [...trackingMagnitudeY];

        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();

        currentTime += dt;
        animationFrameId = requestAnimationFrame(animate);
    }

    window.onload = () => {
        initCharts();
        resetSimulation();
    };
</script>

</body>
</html>
