<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>푸리에 주파수 분석기 - 맥박형 시각화</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0b0f19; 
            color: #e2e8f0; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #61dafb; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; }
        
        .controls { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            margin-bottom: 25px; 
        }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 220px; flex: 1; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        input[type="number"] { 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
        }
        input[type="range"] { 
            width: 100%; 
            accent-color: #61dafb;
        }
        
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
        }
        .chart-container h3 { margin-top: 0; font-size: 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        canvas { width: 100% !important; height: 300px !important; }
        
        button { 
            padding: 12px 30px; 
            background: linear-gradient(135deg, #38bdf8, #0369a1); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(3, 105, 161, 0.4);
        }
        .highlight-freq { color: #f43f5e; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fourier Winding Machine (10초 확장 분석 버전)</h2>
    <p>제안하신 대로 분석 시간을 10초로 확장하여 일치하는 주파수에서의 격렬한 진동 및 급등 현상을 시각화합니다.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">합성 주파수 A (Hz)</label>
                <input type="number" id="freq1" value="2" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group">
                <label for="freq2">합성 주파수 B (Hz)</label>
                <input type="number" id="freq2" value="3" min="0.5" max="8" step="0.5">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="startBtn">실시간 감기 시작</button>
            </div>
        </div>
        <div class="control-group">
            <label for="windingFreqInput">기계가 파형을 감는 진동수: <span id="windingFreqVal" class="highlight-freq">1.00</span> Hz</label>
            <input type="range" id="windingFreqInput" min="0.5" max="5.0" step="0.05" value="1.0">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container">
            <h3>1. 원래 시간-세기 그래프 (0 ~ 10초)</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 원형 틀에 둘둘 감아버린 파형</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container full-width">
            <h3>3. 요청하신 실시간 무게중심 변위 그래프 (X: 시간, Y: 변위 좌표 좌표계)</h3>
            <canvas id="centerTrackingChart"></canvas>
        </div>
    </div>
</div>

<script>
    const maxTime = 10.0; // 요청하신 대로 10초로 늘림!
    const dt = 0.02;     
    
    let currentTime = 0;
    let animationFrameId = null;
    
    let f1 = 2.0;
    let f2 = 3.0;
    let windingFreq = 1.0;
    
    let complexPoints = [];
    let trackingTimeX = [];
    let trackingMagnitudeY = [];
    
    // 푸리에 적분 누적값 (실시간 적분 변화량 계산용)
    let integralReal = 0;
    let integralImag = 0;

    let timeChart, complexChart, centerTrackingChart;

    const freq1Input = document.getElementById('freq1');
    const freq2Input = document.getElementById('freq2');
    const windingInput = document.getElementById('windingFreqInput');
    const windingVal = document.getElementById('windingFreqVal');
    const startBtn = document.getElementById('startBtn');

    windingInput.addEventListener('input', (e) => {
        windingFreq = parseFloat(e.target.value);
        windingVal.innerText = windingFreq.toFixed(2);
        resetSimulation();
    });
    
    freq1Input.addEventListener('change', () => { f1 = parseFloat(freq1Input.value); resetSimulation(); });
    freq2Input.addEventListener('change', () => { f2 = parseFloat(freq2Input.value); resetSimulation(); });
    startBtn.addEventListener('click', startSimulation);

    function signalFunction(t) {
        return Math.sin(2 * Math.PI * f1 * t) + Math.sin(2 * Math.PI * f2 * t);
    }

    function initCharts() {
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        timeChart = new Chart(document.getElementById('timeChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [
                    { label: '합성 신호 f(t)', data: [], borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0, tension: 0.4 },
                    { label: '현재 위치', data: [], borderColor: '#f43f5e', borderDash: [4,4], pointRadius: 0 }
                ]
            },
            options: { scales: { x: { type: 'linear', min: 0, max: maxTime } }, animation: false, plugins: { legend: { display: false } } }
        });

        complexChart = new Chart(document.getElementById('complexChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: '원형으로 감긴 파형', data: [], borderColor: '#4ade80', borderWidth: 1.5, showLine: true, pointRadius: 0, tension: 0.4 },
                    { label: '현재 끝점', data: [], backgroundColor: '#f43f5e', pointRadius: 5 }
                ]
            },
            options: { 
                scales: { 
                    x: { min: -2.5, max: 2.5, grid: { color: '#1e293b' } }, 
                    y: { min: -2.5, max: 2.5, grid: { color: '#1e293b' } } 
                }, 
                aspectRatio: 1, 
                animation: false,
                plugins: { legend: { display: false } }
            }
        });

        // 3번 차트: 스크린샷의 '요동치며 급등하는 그래프' 메커니즘 적용
        centerTrackingChart = new Chart(document.getElementById('centerTrackingChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: '무게중심 변위 흔적',
                    data: [],
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.05)',
                    fill: true,
                    pointRadius: 0,
                    tension: 0.2
                }]
            },
            options: {
                scales: {
                    x: { type: 'linear', min: 0, max: maxTime, title: { display: true, text: '시간 (초)' } },
                    y: { title: { display: true, text: '변위 스케일' } }
                },
                animation: false
            }
        });
    }

    function resetSimulation() {
        cancelAnimationFrame(animationFrameId);
        currentTime = 0;
        complexPoints = [];
        trackingTimeX = [];
        trackingMagnitudeY = [];
        integralReal = 0;
        integralImag = 0;

        let t_arr = [];
        for(let t=0; t<=maxTime; t+=dt) t_arr.push({x: t, y: signalFunction(t)});
        
        timeChart.data.datasets[0].data = t_arr;
        timeChart.data.datasets[1].data = [];
        
        complexChart.data.datasets[0].data = [];
        complexChart.data.datasets[1].data = [];
        
        centerTrackingChart.data.datasets[0].data = [];
        
        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();
    }

    function startSimulation() {
        f1 = parseFloat(freq1Input.value);
        f2 = parseFloat(freq2Input.value);
        windingFreq = parseFloat(windingInput.value);
        resetSimulation();
        animate();
    }

    function animate() {
        if (currentTime > maxTime) {
            cancelAnimationFrame(animationFrameId);
            return;
        }

        let f_t = signalFunction(currentTime); 
        let theta = -2 * Math.PI * windingFreq * currentTime; 
        
        // 2번 원형 감기 좌표
        let x = f_t * Math.cos(theta);
        let y = f_t * Math.sin(theta);

        // 3번 그래프를 위한 연속 푸리에 변환 수치 적분(Aero-Dynamic Tracking)
        // 시간이 지나면서 일치하는 주파수는 적분 값이 폭발적으로 요동치며 커짐
        integralReal += f_t * Math.cos(theta) * dt;
        integralImag += f_t * Math.sin(theta) * dt;
        let currentIntegrationVal = Math.sqrt(integralReal**2 + integralImag**2);

        complexPoints.push({x: x, y: y});
        trackingMagnitudeY.push({x: currentTime, y: currentIntegrationVal});

        // 그래프 갱신
        timeChart.data.datasets[1].data = [{x: currentTime, y: -2.5}, {x: currentTime, y: 2.5}];
        
        complexChart.data.datasets[0].data = [...complexPoints];
        complexChart.data.datasets[1].data = [{x: x, y: y}];

        // 스크린샷처럼 실시간 Y축 자동 범위를 위해 차트 빌더 세팅 업데이트
        centerTrackingChart.data.datasets[0].data = [...trackingMagnitudeY];
        centerTrackingChart.options.scales.y.max = Math.max(2.0, currentIntegrationVal * 1.2);

        timeChart.update();
        complexChart.update();
        centerTrackingChart.update();

        currentTime += dt;
        animationFrameId = requestAnimationFrame(animate);
    }

    window.onload = () => {
        initCharts();
        resetSimulation();
    };
</script>

</body>
</html>
